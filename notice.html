<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sangat Notice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f5f2;--panel:#fff;--ink:#1d1b19;--muted:#6f6962;--line:#e7e3dd;--field:#d8d3cc;--accent:#7b2d26;--accentInk:#fff;--soft:#f3f1ed;
  --chat:#ece5dd;--bubble:#fff;--wa:#1f8f4e;--link:#1a6fb5;--danger:#b23b3b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141312;--panel:#1c1b19;--ink:#eeeae4;--muted:#a39b92;--line:#2d2a27;--field:#3f3b37;--accent:#e3a59b;--accentInk:#1a1210;--soft:#252320;
  --chat:#0f1a1f;--bubble:#1f2c33;--wa:#25a35a;--link:#6cb6f2;--danger:#e07070}}
:root[data-theme="dark"]{--bg:#141312;--panel:#1c1b19;--ink:#eeeae4;--muted:#a39b92;--line:#2d2a27;--field:#3f3b37;--accent:#e3a59b;--accentInk:#1a1210;--soft:#252320;
  --chat:#0f1a1f;--bubble:#1f2c33;--wa:#25a35a;--link:#6cb6f2;--danger:#e07070}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Devanagari",system-ui,sans-serif;font-size:15px;line-height:1.5}
button{font:inherit;color:inherit}
.app{max-width:1120px;margin:0 auto;padding:32px 16px 56px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);gap:24px 32px;align-items:start}

/* header */
.top{grid-column:1/-1;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-bottom:20px;border-bottom:1px solid var(--line)}
h1{font-size:22px;font-weight:700;margin:0;line-height:1.3}
.sub{color:var(--muted);font-size:13.5px;margin:2px 0 0}
.tabs{display:none;grid-column:1/-1}
.modes{grid-column:1/-1;justify-self:center;width:min(620px,100%);display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--soft);border:1px solid var(--line);border-radius:14px}
.modes button{border:0;background:transparent;border-radius:10px;padding:10px 12px;cursor:pointer;display:grid;gap:1px;text-align:center}
.modes button:hover:not([aria-pressed="true"]){background:var(--panel)}
.modes b{font-size:15.5px;font-weight:700}
.modes small{font-size:12px;color:var(--muted)}
.modes button[aria-pressed="true"]{background:var(--accent);color:var(--accentInk);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.modes button[aria-pressed="true"] small{color:inherit;opacity:.85}

/* sections */
.col{display:grid;gap:28px;min-width:0}
.sec{display:grid;gap:12px;min-width:0}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
h2{font-size:13px;font-weight:600;color:var(--muted);margin:0}
.panel,.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;container:box/inline-size}
.panel{padding:18px;display:grid;gap:18px}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px 16px}
@container box (max-width:620px){ .g2{grid-template-columns:minmax(0,1fr)} }
.lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
.hint{font-size:12.5px;color:var(--muted);margin:0;line-height:1.5}
.mt8{margin-top:8px}

/* controls */
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--panel);border:1px solid var(--field);border-radius:8px}
input,select{height:40px;padding:0 12px;width:100%}
textarea{width:100%;padding:9px 12px;line-height:1.55;resize:vertical;display:block}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
::placeholder{color:var(--muted);opacity:.75}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;height:40px;border:1px solid var(--field);border-radius:8px;overflow:hidden;background:var(--panel);flex:none}
.seg button{border:0;background:transparent;padding:0 12px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button+button{border-left:1px solid var(--field)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accentInk)}
.link{background:none;border:0;color:var(--accent);font-size:12.5px;font-weight:600;cursor:pointer;padding:0}
.link:hover{text-decoration:underline}

.dt{display:grid;gap:4px}
.dhint{font-size:12.5px;color:var(--accent);font-weight:600;min-height:19px}

.tpair{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px}
.tp{display:inline-flex;align-items:center;gap:6px}
.tbox{display:inline-flex;align-items:center;height:40px;border:1px solid var(--field);border-radius:8px;background:var(--panel);padding:0 6px}
.tbox:focus-within{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.tbox select{border:0;height:38px;width:auto;min-width:36px;padding:0 4px;font-size:15.5px;font-weight:600;background:transparent;-webkit-appearance:none;appearance:none;text-align:center;text-align-last:center;cursor:pointer}
.tbox select:focus{outline:none}
.tbox b{color:var(--muted);font-weight:600}
.seg.ap{width:82px}
.seg.ap button{padding:0 6px}
.tsep{font-size:13px;color:var(--muted);font-weight:600;min-width:18px}

.pf{display:flex;gap:8px}
.pf input{flex:1;min-width:0}

.addr{white-space:pre-line;font-size:13.5px;line-height:1.55;padding:10px 12px;border-radius:8px;background:var(--soft);margin-top:8px}
.place textarea{margin-top:8px}
.maprow{display:flex;align-items:center;gap:10px;margin-top:8px}
.maprow input{flex:1;min-width:0;font-size:14px}
.open{flex:none;font-size:13px;font-weight:600;color:var(--link);text-decoration:none;white-space:nowrap}
.check{display:flex;align-items:center;gap:10px;height:40px;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent);margin:0}

/* sangat cards */
.cards{display:grid;gap:12px}
.card{overflow:hidden}
.ch{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.cn{width:22px;height:22px;border-radius:50%;border:1px solid var(--field);font-size:12px;font-weight:600;color:var(--muted);display:grid;place-items:center;flex:none}
.ct{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.cs{flex:1;min-width:0;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:2px;flex:none}
.ib{width:30px;height:30px;border-radius:6px;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:14px;display:grid;place-items:center}
.ib:hover:not(:disabled){background:var(--soft);color:var(--ink)}
.ib:disabled{opacity:.3;cursor:default}
.ib.del:hover{color:var(--danger)}
.cb{padding:16px;display:grid;gap:18px}
.opt{border-top:1px solid var(--line);padding-top:16px}
.opt .lbl .link,.lbl .link.rmv{color:var(--muted);font-weight:500}
.opt .lbl .link:hover,.lbl .link.rmv:hover{color:var(--danger)}
.presets{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-top:8px;font-size:12.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;border-top:1px solid var(--line);padding-top:16px}
.chip{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--field);background:transparent;font-size:13px;color:var(--ink);cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.add{height:44px;border-radius:12px;border:1px dashed var(--field);background:transparent;font-weight:600;font-size:14px;cursor:pointer}
.add:hover{border-color:var(--accent);color:var(--accent)}

.sdesc{font-size:12.5px;color:var(--muted);margin:-6px 0 0;line-height:1.5}
.tlist{padding:0;gap:0}
.trow{padding:14px 18px;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.thead{display:flex;align-items:flex-start;gap:12px}
.tinfo{flex:1;min-width:0}
.tchk{width:18px;height:18px;margin:2px 0 0;flex:none;accent-color:var(--accent);cursor:pointer}
.trow.off .tname{color:var(--muted)}
.tedit{padding-left:30px}
.tname{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.twhere{font-size:12px;color:var(--muted);margin-top:1px}
.tsnip{font-size:13px;color:var(--muted);margin-top:6px;padding-left:10px;border-left:2px solid var(--line);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tsnip.empty{font-style:italic}
.badge{font-size:11px;font-weight:600;color:var(--accent);border:1px solid currentColor;border-radius:999px;padding:0 7px;line-height:18px}
.tbtn{flex:none;height:32px;padding:0 14px;border-radius:8px;border:1px solid var(--field);background:var(--panel);font-size:13px;font-weight:600;cursor:pointer}
.tbtn:hover{border-color:var(--accent);color:var(--accent)}
.tedit{margin-top:10px}
.tfoot{display:flex;justify-content:space-between;align-items:center;margin-top:8px}

/* output */
.out{position:sticky;top:24px;display:grid;gap:12px;min-width:0}
.chat{background:var(--chat);border-radius:12px;padding:12px;max-height:calc(100vh - 210px);overflow:auto}
.bubble{background:var(--bubble);border-radius:8px;padding:10px 12px;font-size:14.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.bubble a{color:var(--link)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{font-weight:600;font-size:14.5px;height:44px;border-radius:10px;cursor:pointer;border:1px solid var(--field);background:var(--panel)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.toast{font-size:13px;color:var(--muted);min-height:20px;text-align:center}
.mbar{display:none}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);padding:20px 16px 110px;gap:16px}
  .top{padding-bottom:16px}
  .tabs{display:block;position:sticky;top:0;z-index:4;background:var(--bg);padding:8px 0}
  .tabs .seg{width:100%;background:var(--soft);border-color:var(--line);padding:3px;height:42px;border-radius:10px}
  .tabs .seg button{border:0!important;border-radius:7px}
  .tabs .seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
  body:not([data-view="preview"]) .out{display:none}
  body[data-view="preview"] #form{display:none}
  .out{position:static}
  .chat{max-height:none}
  .out .actions{display:none}
  .mbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);z-index:5}
}
@media (max-width:420px){ .modes button{padding:9px 6px} .modes small{font-size:11px} }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <h1>सत्संग सूचना</h1>
      <p class="sub">विवरण भरें — WhatsApp संदेश अपने-आप तैयार होगा।</p>
    </div>
  </header>
  <nav class="modes" id="modes" aria-label="सूचना का प्रकार">
    <button type="button" data-mode="regular"><b>साधारण सूचना</b><small>एक या अधिक सत्संग का कार्यक्रम</small></button>
    <button type="button" data-mode="special"><b>विशेष सत्संग</b><small>महात्मा जी के पधारने की सूचना</small></button>
  </nav>
  <div class="tabs">
    <div class="seg" id="views">
      <button type="button" data-view="edit">विवरण भरें</button>
      <button type="button" data-view="preview">संदेश देखें</button>
    </div>
  </div>

  <div class="col" id="form"></div>

  <aside class="out">
    <div class="sh"><h2>WhatsApp संदेश</h2></div>
    <div class="chat"><div class="bubble" id="preview"></div></div>
    <div class="actions">
      <button class="btn wa" data-share>Share to WhatsApp</button>
      <button class="btn" data-copy>Copy message</button>
    </div>
    <div class="toast" id="toast" role="status"></div>
  </aside>
</div>
<div class="mbar">
  <button class="btn wa" data-share>Share to WhatsApp</button>
  <button class="btn" data-copy>Copy</button>
</div>
<datalist id="dl-people"></datalist>

<script>
// GEN-START — pure message builder (no DOM), also used by tests
const MONTHS = ["जनवरी","फ़रवरी","मार्च","अप्रैल","मई","जून","जुलाई","अगस्त","सितंबर","अक्टूबर","नवंबर","दिसंबर"];
const DAYS = ["रविवार","सोमवार","मंगलवार","बुधवार","वीरवार","शुक्रवार","शनिवार"];
const DIV = "━━━━━━━━━━━━━━━━━━";
const DEF = {
  intro: "सत्संग वह पावन अवसर है, जहाँ मन को शांति, विचारों को पवित्रता और जीवन को भक्ति की नई दिशा मिलती है। जहाँ सत्संग होता है, वहाँ प्रेम, नम्रता और भक्ति का संचार होता है। सत्संग केवल सुनने का नहीं, बल्कि अपने जीवन को सुंदर विचारों और सद्भावना से सँवारने का अवसर है।",
  invite: "इसी पावन भावना के साथ आप सभी महात्माओं को नीचे दिए गए सत्संग कार्यक्रम में सपरिवार सादर आमंत्रित किया जाता है।",
  closing: "सत्संग की महिमा तब और बढ़ जाती है, जब हम सब मिलकर एक परिवार की तरह इसमें सम्मिलित होते हैं।\n\nअतः सभी महात्माओं से करबद्ध प्रार्थना है कि अपने परिवारजनों सहित अधिक से अधिक संख्या में पहुँचकर सत्संग कार्यक्रम की शोभा बढ़ाएँ।\n\nआइए, हम सभी मिलकर सतगुरु की शिक्षाओं एवं निरंकार प्रभु की महिमा का गुणगान करें और इस आध्यात्मिक आनंद के सहभागी बनें जी।",
  sclosing: "आप सभी महात्माओं से विनम्र निवेदन है कि कृपया अपने पूरे परिवार सहित इस सत्संग कार्यक्रम में शामिल होकर सतगुरु की रहमतों एवं आशीर्वाद के पात्र बने जी।"
};
const NOTES = {
  bal: "बाल संगत बच्चों में अच्छे संस्कार, प्रेम, सेवा, सुमिरन और सत्संग की भावना जागृत करने का एक सुंदर प्रयास है।",
  langarS: "(सत्संग के पश्चात सभी महात्माओं के लिए लंगर प्रसाद की व्यवस्था भी रहेगी जी।)",
  langar: "🍽️ सत्संग के पश्चात सभी महात्माओं के लिए लंगर प्रसाद की व्यवस्था भी रहेगी जी।"
};
const LANGAR_NOTE = "(सत्संग के पश्चात सभी महात्माओं के लिए लंगर प्रसाद की व्यवस्था भी रहेगी जी।)";

function dparts(iso){
  if (!iso) return null;
  const [y,m,d] = iso.split("-").map(Number);
  return { day: DAYS[new Date(y,m-1,d).getDay()], txt: `${d} ${MONTHS[m-1]} ${y}`, short: `${d} ${MONTHS[m-1]}` };
}
const dateR = iso => { const p = dparts(iso); return p ? `${p.day}, ${p.txt}` : ""; };   // सोमवार, 23 नवंबर 2026
const dateS = iso => { const p = dparts(iso); return p ? `${p.txt}, ${p.day}` : ""; };   // 22 नवंबर 2026, रविवार
function hm(t){ const [h,m] = t.split(":").map(Number); return { h, m, txt:`${h%12||12}:${String(m).padStart(2,"0")}` }; }
const perR = h => h>=4&&h<12 ? "प्रात:" : h>=12&&h<16 ? "दोपहर" : h>=16&&h<21 ? "सायं" : "रात्रि";
const perS = h => h>=4&&h<12 ? "सुबह" : h>=12&&h<16 ? "दोपहर" : h>=16&&h<21 ? "शाम" : "रात";
// regular: "प्रात: 7:30 बजे से 8:30 बजे तक"   special: "सुबह 10:00 से दोपहर 12:00 बजे तक"
function timeR(s,e){
  if (!s) return ""; const a = hm(s), pa = perR(a.h);
  if (!e) return `${pa} ${a.txt} बजे`;
  const b = hm(e), pb = perR(b.h);
  return `${pa} ${a.txt} बजे से ${pb!==pa ? pb+" " : ""}${b.txt} बजे तक`;
}
function timeS(s,e){
  if (!s) return ""; const a = hm(s), pa = perS(a.h);
  if (!e) return `${pa} ${a.txt} बजे`;
  const b = hm(e), pb = perS(b.h);
  return `${pa} ${a.txt} से ${pb!==pa ? pb+" " : ""}${b.txt} बजे तक`;
}
function clock(t){ const {h,m} = hm(t||"07:00"); return String.fromCodePoint((m>=30 ? 0x1F55C : 0x1F550) + (h%12||12) - 1); }
function person(p){ const n = ((p && p.name) || "").trim().replace(/\s*जी$/,""); return n ? `${p.title} ${n} जी` : ""; }
const txt = (v,d) => (v==null ? d : v).trim();
const ftext = (st, k) => (st.textOff || {})[k] ? "" : txt((st.text || {})[k], DEF[k]);
const title = s => (s.name||"").trim() || "सत्संग";
const flower = s => /सांझी|साँझी/.test(s.name||"") ? "🌺" : "🌼";
const addrLines = a => (a||"").split(/\n+/).map(x => x.trim()).filter(Boolean);
const locOf = (s, st) => s.ownPlace && (s.loc.place||"").trim() ? s.loc : st.loc;
const locKey = l => (l.place||"").trim().replace(/\s+/g," ") + "|" + (l.map||"").trim();
const tidy = L => L.join("\n").replace(/[ \t]+\n/g,"\n").replace(/\n{3,}/g,"\n\n").trim();

function placeBlock(l){
  const a = addrLines(l.place); if (!a.length) return [];
  const out = ["📍 *सत्संग स्थल*", ...a];
  if ((l.map||"").trim()) out.push("", "📌 *Google Map Location:*", l.map.trim());
  return out;
}
function sevaLines(s, vicharIcon, withPrasad){
  // an empty name keeps the line, just left blank after the label
  const BLANK = "", L = [];
  if (s.sanchalanOn !== false) L.push(`🎤 *मंच संचालन:* ${person(s.sanchalan) || BLANK}`);
  if (s.vicharOn !== false) L.push(`${vicharIcon} *स्टेज से विचार:* ${person(s.vichar) || BLANK}`);
  if (withPrasad) L.push(`🙏 *${s.prasadType || "प्रसाद सेवा"}:* ${person(s.prasad) || BLANK}`);
  return L;
}

function buildRegular(st){
  const T = st.text || {}, list = st.sangats, multi = list.length > 1;
  const sharedDate = list[0].date && list.every(s => s.date === list[0].date);   // one day → date banner at the top (even for a single sangat)
  const locs = list.map(s => locOf(s, st));
  const oneLoc = locs.every(l => locKey(l) === locKey(locs[0]));
  const L = ["🌹 🙏 *धन निरंकार जी* 🙏🌹", ""];

    <div class="panel tlist">${rows}</div>
  </section>`;
}
function regularHTML(){
  const n = state.sangats.length;
  return `<section class="sec">
      <div class="sh"><h2>सत्संग कार्यक्रम</h2><button type="button" class="link" data-act="reset">डिफ़ॉल्ट पर लौटाएँ</button></div>
      </div>
      <div class="cards">${state.sangats.map((s, i) => cardHTML(s, i, n)).join("")}</div>
      <button type="button" class="add" data-act="add">+ सत्संग जोड़ें</button>
      <p class="hint">एक ही दिन के सभी सत्संग हों तो दिन संदेश में एक बार ऊपर लिखा जाएगा।</p>
    </section>
    <section class="sec">
      <div class="sh"><h2>सत्संग स्थल</h2></div>
      <div class="panel">${placeCtl("loc")}
        <p class="hint">सभी सत्संग के लिए। किसी सत्संग का स्थान अलग हो तो उसके कार्ड में “+ अलग स्थान” चुनें — तब हर सत्संग के साथ उसका स्थान लिखा जाएगा।</p></div>
    </section>
    ${textsHTML([["intro",5],["invite",2],["closing",6]])}`;
}
function specialHTML(){
  const b = "special", sp = state.special;
  return `<section class="sec">
      <div class="sh"><h2>विशेष सत्संग</h2><button type="button" class="link" data-act="reset">डिफ़ॉल्ट पर लौटाएँ</button></div>
      <div class="panel">
        ${fld("पधारने वाले महात्मा", personCtl(b+".visitor", "नाम लिखें"))}
        <div class="g2">${fld("दिनांक", dateCtl(b+".date"))}</div>
        ${fld("समय", timePair(b+".start", b+".end"))}
        ${sp.langarNote
          ? opt(b+".langarNote", "लंगर की सूचना — यह पंक्ति संदेश में जुड़ेगी",
              `<textarea data-path="${b}.langarText" rows="2">${esc(sp.langarText ?? LANGAR_NOTE)}</textarea>
               <div class="presets">${sp.langarText != null && sp.langarText !== LANGAR_NOTE ? `<button type="button" class="link" data-preset="${b}.langarText" data-val="langarS">मूल पाठ पर लौटाएँ</button>` : `<span>समय के ठीक नीचे आएगी। चाहें तो शब्द बदल सकते हैं।</span>`}</div>`)
          : `<div class="chips"><button type="button" class="chip" data-toggle="${b}.langarNote">+ लंगर की सूचना जोड़ें</button><span class="hint" style="align-self:center">“सत्संग के पश्चात … लंगर प्रसाद की व्यवस्था भी रहेगी जी।”</span></div>`}
        ${stageFields(b, sp)}
        ${sp.prasadOn !== false ? fldRm(b+".prasadOn", "प्रसाद / लंगर सेवा", segCtl(b+".prasadType", ["प्रसाद सेवा","लंगर प्रसाद सेवा"]) + `<div class="mt8">${personCtl(b+".prasad")}</div>`) : ""}
        ${(() => { const c = [["sanchalanOn","+ मंच संचालन"],["vicharOn","+ स्टेज से विचार"],["prasadOn","+ प्रसाद / लंगर सेवा"]].filter(([k]) => sp[k] === false)
            .map(([k,l]) => `<button type="button" class="chip" data-toggle="${b}.${k}">${l}</button>`).join(""); return c ? `<div class="chips">${c}</div>` : ""; })()}
        ${fld("स्थान", placeCtl(b+".loc"))}
        ${fld("संदेश में स्थान का नाम", `<input data-path="${b}.bhawan" placeholder="जैसे: साई कुंज भवन" value="${esc(sp.bhawan)}"><p class="hint mt8">“… ${esc(sp.bhawan || "साई कुंज भवन")} में पधारकर …”</p>`)}
        <p class="hint">जो नाम खाली छोड़ेंगे, वह पंक्ति संदेश में खाली रहेगी — बाद में भर सकते हैं।</p>
      </div>
    </section>
    ${textsHTML([["sclosing",4]])}`;
}

function render(){
  $("form").innerHTML = state.mode === "special" ? specialHTML() : regularHTML();
  document.querySelectorAll("[data-mode]").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === state.mode));
  update();
}
function update(){
  $("preview").innerHTML = esc(buildMessage(state))
    .replace(/https?:\/\/\S+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`)
    .replace(/\*([^*\n]+)\*/g, "<b>$1</b>");
  document.querySelectorAll(".card .cs").forEach((el, i) => { if (state.sangats[i]) el.textContent = summary(state.sangats[i]); });
  save();
}

/* ---- events ---- */
function readPicker(tp){
  const h = tp.querySelector('[data-part="h"]').value, m = tp.querySelector('[data-part="m"]').value;
  const ap = tp.querySelector('[data-ap][aria-pressed="true"]').dataset.ap;
  if (!h) return "";
  let H = +h % 12; if (ap === "PM") H += 12;
  return String(H).padStart(2,"0") + ":" + m;
}
const mins = t => { const [h,m] = t.split(":").map(Number); return h*60+m; };
function setTime(path, v){                             // moving a start time moves its end time too (same duration)
  const old = getP(state, path); setP(state, path, v);
  const endPath = path.replace(/\.start$/, ".end").replace(/\.ptStart$/, ".ptEnd");
  if (endPath === path || !old || !v) return;
  const end = getP(state, endPath); if (!end) return;
  const n = ((mins(end) + mins(v) - mins(old)) % 1440 + 1440) % 1440;
  setP(state, endPath, String(Math.floor(n/60)).padStart(2,"0") + ":" + String(n%60).padStart(2,"0"));
}
function allLocs(){ return [state.loc, state.special.loc, ...state.sangats.map(s => s.loc)]; }
function syncMap(l){                                 // same place → same map link everywhere
  const pl = (l.place||"").trim(); if (!pl) return;
  allLocs().forEach(x => { if ((x.place||"").trim() === pl) x.map = l.map; });
}
const form = $("form");
form.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.text){ const k = el.dataset.text; state.text[k] = el.value === DEF[k] ? null : el.value; return update(); }
  const p = el.dataset.path; if (!p) return;
  setP(state, p, el.value);
  if (p.endsWith(".map")) syncMap(getP(state, p.slice(0, -4)));
  if (el.type === "date"){ const h = el.parentElement.querySelector(".dhint"); if (h) h.textContent = dateR(el.value); }
  if (/^sangats\.\d+\.name$/.test(p)) el.closest(".card").querySelector(".ct").textContent = title(getP(state, p.slice(0, -5)));
  update();
});
form.addEventListener("change", e => {
  const el = e.target;
  const tp = el.closest(".tp"); if (tp){ setTime(tp.dataset.tpath, readPicker(tp)); return render(); }
  if (el.dataset.namesel != null){
    const s = state.sangats[+el.dataset.namesel];
    if (el.value === "__new"){ s.nameCustom = true; s.name = ""; }
    else {
      s.nameCustom = false; s.name = el.value;
      if (/बाल/.test(el.value) && !s.noteOn){ s.noteOn = true; s.note = NOTES.bal; }
    }
    render();
    if (el.value === "__new") document.querySelector(`[data-path="sangats.${el.dataset.namesel}.name"]`)?.focus();
    return;
  }
  if (el.dataset.placesel){
    const lp = el.dataset.placesel, l = getP(state, lp);
    if (el.value === "__new"){ l.custom = true; l.place = ""; l.map = ""; }
    else {
      const all = allPlaces(), a = Object.keys(all)[+el.value];
      l.custom = false; l.place = a; l.map = all[a] || "";
      if (lp === "special.loc"){ const k = placeInfo(a); state.special.bhawan = k ? k.bhawan : ""; }
    }
    render();
    if (el.value === "__new") document.querySelector(`[data-path="${lp}.place"]`)?.focus();
    return;
  }
  if (el.dataset.texton){ state.textOff[el.dataset.texton] = !el.checked; return render(); }
  if (el.dataset.check){ setP(state, el.dataset.check, el.checked); return update(); }
  const p = el.dataset.path; if (!p) return;
  if (/\.(place|map)$/.test(p)){
    const l = getP(state, p.replace(/\.(place|map)$/, ""));
    if ((l.place||"").trim()){ state.places = state.places || {}; state.places[l.place.trim()] = (l.map||"").trim(); }
    if (p.endsWith(".map")) return render();
  }
  if (/\.name$/.test(p) && !/^sangats\.\d+\.name$/.test(p) && el.value.trim()) addPerson(el.value.trim().replace(/\s*जी$/,""));
  // Changing a sangat's date brings in that day's default programme (in place of the old day's sangats).
  const dm = p.match(/^sangats\.(\d+)\.date$/);
  if (dm && el.value && el.value !== el.defaultValue && +el.value.slice(0,4) >= 2000){
    const i = +dm[1], old = el.defaultValue, L = state.sangats;
    const same = L.map((s, j) => j === i || (old && s.date === old) ? j : -1).filter(j => j >= 0);
    const at = same[0];
    state.sangats = L.filter((_, j) => !same.includes(j));
    state.sangats.splice(at, 0, ...scheduleFor(el.value));
    return render();
  }
  if (el.type === "date" || p === "special.bhawan") return render();
  save();
});

function addSangat(){
  const last = state.sangats[state.sangats.length-1];
  const s = JSON.parse(JSON.stringify(last));
  Object.assign(s, { name:"सत्संग", nameCustom:false, prasadOn:false, ptOn:false, noteOn:false, note:"", contactOn:false, contact:{ title:"महात्मा", name:"", phone:"" } });
  const from = last.end || last.start || "07:30", [H,M] = from.split(":").map(Number);
  s.start = from; s.end = String((H+1)%24).padStart(2,"0") + ":" + String(M).padStart(2,"0");
  state.sangats.push(s); render();
  document.querySelector(".cards").lastElementChild.scrollIntoView({ behavior:"smooth", block:"start" });
}
function resetMode(){
  if (!confirm("इस पेज के सभी फ़ील्ड डिफ़ॉल्ट पर लौटाएँ?")) return;
  if (state.mode === "special"){ state.special = newSpecial(); state.text.sclosing = null; delete state.textOff.sclosing; }
  else { state.sangats = scheduleFor(todayISO()); state.loc = loc0(); state.text.intro = state.text.invite = state.text.closing = null; ["intro","invite","closing"].forEach(k => delete state.textOff[k]); }
  render();
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-ap],[data-set],[data-toggle],[data-preset],[data-textreset],[data-tedit],[data-act],[data-mode],[data-view]");
  if (!t) return;
  if (t.dataset.ap){
    t.parentElement.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b === t));
    const tp = t.closest(".tp"); setTime(tp.dataset.tpath, readPicker(tp)); return render();
  }
  if (t.dataset.set){ setP(state, t.dataset.set, t.dataset.val); return render(); }
  if (t.dataset.toggle){
    const p = t.dataset.toggle, on = !getP(state, p); setP(state, p, on);
    if (on && p.endsWith(".ownPlace")) getP(state, p.slice(0, -9)).loc = { place:"", map:"", custom:true };
    render();
    if (on){ const k = p.split(".").pop(); const f = { sanchalanOn:".sanchalan.name", vicharOn:".vichar.name", langarNote:".langarText", prasadOn:".prasad.name", contactOn:".contact.name", noteOn:".note", ownPlace:".loc.place" }[k];
      if (f) document.querySelector(`[data-path="${p.slice(0, -k.length-1)}${f}"]`)?.focus(); }
    return;
  }
  if (t.dataset.preset){ setP(state, t.dataset.preset, NOTES[t.dataset.val]); return render(); }
  if (t.dataset.tedit){
    const k = t.dataset.tedit; textEdit[k] = !textEdit[k]; render();
    if (textEdit[k]){ const ta = document.querySelector(`[data-text="${k}"]`); ta?.focus(); ta?.setSelectionRange(ta.value.length, ta.value.length); }
    return;
  }
  if (t.dataset.textreset){ state.text[t.dataset.textreset] = null; return render(); }
  if (t.dataset.mode){ state.mode = t.dataset.mode; return render(); }
  if (t.dataset.view){ document.body.dataset.view = t.dataset.view; setView(); scrollTo(0,0); return; }
  const act = t.dataset.act, i = +t.dataset.i, L = state.sangats;
  if (act === "add") return addSangat();
  if (act === "reset") return resetMode();
  if (act === "up" && i > 0) [L[i-1], L[i]] = [L[i], L[i-1]];
  if (act === "down" && i < L.length-1) [L[i+1], L[i]] = [L[i], L[i+1]];
  if (act === "del" && L.length > 1 && confirm("इस सत्संग को हटाएँ?")) L.splice(i, 1);
  render();
});
function setView(){ const v = document.body.dataset.view || "edit"; document.querySelectorAll("[data-view]").forEach(b => b.setAttribute("aria-pressed", b.dataset.view === v)); }

// If the page stays open past midnight (or comes back from the background), move past dates to today.
let pageDay = todayISO();
function refreshToday(){ const t = todayISO(); if (t === pageDay) return; pageDay = t; bumpDates(); render(); }
document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshToday(); });
addEventListener("focus", refreshToday);
setInterval(refreshToday, 60000);

function toast(m){ $("toast").textContent = m; clearTimeout(toast.t); toast.t = setTimeout(() => $("toast").textContent = "", 3000); }
async function copyMsg(){
  try { await navigator.clipboard.writeText(buildMessage(state)); toast("संदेश कॉपी हो गया"); }
  catch(e){ toast("Copy blocked by the browser"); }
}
async function shareMsg(){
  const text = buildMessage(state);
  if (navigator.share && /Android|iPhone|iPad/i.test(navigator.userAgent)){
    try { await navigator.share({ text }); return; } catch(e){ if (e.name === "AbortError") return; }
  }
  window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank");
}
document.querySelectorAll("[data-copy]").forEach(b => b.onclick = copyMsg);
document.querySelectorAll("[data-share]").forEach(b => b.onclick = shareMsg);

fillPeople(); setView(); render();
</script>
<!-- Visit counter (GoatCounter: no cookies, no personal data).
     Sends a tiny request straight to our counter instead of loading gc.zgo.at/count.js, which ad blockers block. -->
<script>
  const GC_URL = "https://madhursharma1999.goatcounter.com/count";
  function gcHit(path, title, isEvent){
    try {
      if (!/^https?:$/.test(location.protocol) || /^(localhost|127\.)/.test(location.hostname)) return;   // only count the live site
      const q = new URLSearchParams({
        p: path, t: title || document.title, e: isEvent ? "true" : "false",
        r: isEvent ? "" : document.referrer, q: location.search,
        s: [screen.width, screen.height, devicePixelRatio || 1].join(","), rnd: Math.random().toString(36).slice(2)
      });
      (new Image()).src = GC_URL + "?" + q.toString();
    } catch(e){}
  }
  function gcEvent(name){ gcHit(name, name, true); }
  gcHit(location.pathname, document.title, false);
  document.querySelectorAll("[data-share]").forEach(b => b.addEventListener("click", () => gcEvent("notice: share to whatsapp")));
  document.querySelectorAll("[data-copy]").forEach(b => b.addEventListener("click", () => gcEvent("notice: copy message")));
</script>
